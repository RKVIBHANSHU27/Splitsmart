{% extends 'expenses/base.html' %}
{% block title %}{{ action }} Group — SplitSmart{% endblock %}
{% block content %}
<div class="container">
  <div style="max-width:540px;margin:0 auto;">
    <div class="page-header">
      <h1>{{ action }} Group</h1>
    </div>
    <div class="card">
      <div class="card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          <div class="form-group">
            <label class="form-label">Group Name *</label>
            <input type="text" name="name" class="form-control" value="{{ form.name.value|default:'' }}" placeholder="e.g. Dublin Apartment, Weekend Trip">
            {% for err in form.name.errors %}<p class="form-error">{{ err }}</p>{% endfor %}
          </div>
          <div class="form-group">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3" placeholder="Optional...">{{ form.description.value|default:'' }}</textarea>
          </div>
          <div style="display:flex;gap:10px;">
            <a href="{% url 'groups' %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">{{ action }} Group</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
