{% extends 'expenses/base.html' %}
{% block title %}Forgot Password — SmartSplit{% endblock %}
{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;">
  <div style="width:100%;max-width:420px;padding:0 16px;">
    <div style="text-align:center;margin-bottom:32px;">
      <div style="font-size:40px;margin-bottom:12px;">🔐</div>
      <div style="font-family:'DM Mono',monospace;font-size:22px;font-weight:500;margin-bottom:8px;">Reset Password</div>
      <p style="color:#666;font-size:14px;">Enter your username and we'll send a reset code.</p>
    </div>
    <div class="card">
      <div class="card-body">
        {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" placeholder="your_username" autofocus>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:10px;">Send Reset Code</button>
        </form>
      </div>
    </div>
    <p style="text-align:center;margin-top:16px;font-size:14px;color:#666;">
      <a href="{% url 'login' %}" style="color:#111;font-weight:500;">← Back to Sign In</a>
    </p>
  </div>
</div>
{% endblock %}
