{% extends 'expenses/base.html' %}
{% block title %}Confirm Delete — SplitSmart{% endblock %}
{% block content %}
<div class="container">
  <div style="max-width:480px;margin:0 auto;">
    <div class="page-header"><h1>Delete {{ type }}</h1></div>
    <div class="card">
      <div class="card-body">
        <div style="text-align:center;padding:16px 0 24px;">
          <div style="font-size:48px;margin-bottom:16px;">🗑️</div>
          <h3 style="font-size:18px;font-weight:600;margin-bottom:10px;">Are you sure?</h3>
          <p style="color:#666;font-size:14px;">You're about to delete <strong>{{ object }}</strong>.<br>This cannot be undone.</p>
        </div>
        <form method="post">
          {% csrf_token %}
          <div style="display:flex;gap:10px;justify-content:center;">
            <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
