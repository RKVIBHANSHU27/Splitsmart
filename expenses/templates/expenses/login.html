{% extends 'expenses/base.html' %}
{% block title %}Sign In — SplitSmart{% endblock %}
{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;">
  <div style="width:100%;max-width:420px;padding:0 16px;">
    <div style="text-align:center;margin-bottom:32px;">
      <div style="font-family:'DM Mono',monospace;font-size:24px;font-weight:500;margin-bottom:8px;">SplitSmart</div>
      <p style="color:#666;font-size:14px;">Sign in to manage group expenses</p>
    </div>
    <div class="card">
      <div class="card-body">
        {% if form.errors %}
          <div class="alert alert-error">Invalid username or password.</div>
        {% endif %}
        <form method="post" novalidate>
          {% csrf_token %}
          <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" placeholder="your_username" autofocus>
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:10px;">Sign In</button>
        </form>
      </div>
    </div>
    <p style="text-align:center;margin-top:20px;font-size:14px;color:#666;">
      Don't have an account? <a href="{% url 'signup' %}" style="color:#111;font-weight:500;">Sign up</a>
    </p>
  </div>
</div>
{% endblock %}
